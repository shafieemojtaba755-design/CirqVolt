
name: Build CirqVolt APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

          mkdir -p www/assets
          cp index.html app.js styles.css manifest.webmanifest sw.js www/
          cp -R assets/. www/assets/

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.cirqvolt.app",
            "appName": "CirqVolt",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CirqVolt-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
